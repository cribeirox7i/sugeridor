name: Coleta de ofertas (scraper)

# Disparo manual: pelo botão "Rodar coleta" no admin (via API do GitHub) ou pela
# aba Actions do GitHub. Sem agendamento por enquanto — dá pra adicionar um
# bloco `schedule:` aqui no futuro sem mudar mais nada.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Rodar scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scraper.run
